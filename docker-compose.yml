services:
  dev:
    image: ghcr.io/ashswing/ashlab:latest
    pull_policy: always
    container_name: ashlab
    hostname: ashlab
    user: root
    stdin_open: true
    tty: true
    volumes:
      - ./:/workspace
      - tailscale-state:/var/lib/tailscale
    working_dir: /workspace
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=ashlab
      - SSH_ROOT_PASSWORD=${SSH_ROOT_PASSWORD:-root}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - seccomp:unconfined

  nginx:
    image: nginx:latest
    container_name: ashlab-nginx
    depends_on:
      - dev
    network_mode: "service:dev"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  postgres:
    image: postgres:latest
    container_name: ashlab-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    network_mode: "service:dev"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: ashlab-redis
    command: ["redis-server", "--appendonly", "yes"]
    network_mode: "service:dev"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  tailscale-state:
  postgres-data:
  redis-data:
